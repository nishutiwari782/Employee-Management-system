<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Employee Management System</h1>
            <p>Manage your employees easily</p>
        </header>

        <!-- Dashboard -->
        <section class="dashboard">
            <div class="card">
                <h3>Total Employees</h3>
                <span id="totalEmployees">0</span>
            </div>

            <div class="card">
                <h3>Departments</h3>
                <span id="totalDepartments">0</span>
            </div>

            <div class="card">
                <h3>Average Salary</h3>
                <span id="averageSalary">₹0</span>
            </div>
        </section>

        <!-- Employee Form -->
        <section class="form-section">
            <h2 id="formTitle">Add Employee</h2>

            <form id="employeeForm">

                <input type="hidden" id="employeeId">

                <div class="form-grid">

                    <div>
                        <label>Full Name</label>
                        <input type="text" id="name" placeholder="Enter employee name" required>
                    </div>

                    <div>
                        <label>Email</label>
                        <input type="email" id="email" placeholder="Enter email" required>
                    </div>

                    <div>
                        <label>Phone</label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>

                    <div>
                        <label>Department</label>
                        <select id="department" required>
                            <option value="">Select Department</option>
                            <option value="IT">IT</option>
                            <option value="HR">HR</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Sales">Sales</option>
                        </select>
                    </div>

                    <div>
                        <label>Position</label>
                        <input type="text" id="position" placeholder="Enter position" required>
                    </div>

                    <div>
                        <label>Salary</label>
                        <input type="number" id="salary" placeholder="Enter salary" required>
                    </div>

                    <div>
                        <label>Joining Date</label>
                        <input type="date" id="joiningDate" required>
                    </div>

                    <div>
                        <label>Status</label>
                        <select id="status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                </div>

                <div class="buttons">
                    <button type="submit" class="btn-primary" id="submitBtn">
                        Add Employee
                    </button>

                    <button type="button" class="btn-secondary" id="cancelBtn">
                        Cancel
                    </button>
                </div>

            </form>
        </section>

        <!-- Employee List -->
        <section class="employee-section">

            <div class="section-header">
                <h2>Employee List</h2>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search employee..."
                >
            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Position</th>
                            <th>Salary</th>
                            <th>Joining Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="employeeTableBody">
                    </tbody>

                </table>

                <div id="noData" class="no-data">
                    No employees found.
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
